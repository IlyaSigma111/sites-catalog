<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Илья — сайты</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:#07070d;color:#f1f5f9;overflow-x:hidden;}
::selection{background:#ffd700;color:#0a0a12;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#07070d;}
::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.15);border-radius:4px;}

body::after{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:256px;
}

.blob{
  position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;
  animation:blobFloat 25s ease-in-out infinite;
}
.blob-1{width:500px;height:500px;background:rgba(255,215,0,0.03);top:-10%;left:-5%;animation-delay:0s;}
.blob-2{width:400px;height:400px;background:rgba(99,102,241,0.03);bottom:-5%;right:-3%;animation-delay:-8s;}
.blob-3{width:300px;height:300px;background:rgba(0,255,255,0.02);top:40%;left:60%;animation-delay:-16s;}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(30px,-40px) scale(1.1);}66%{transform:translate(-20px,20px) scale(0.9);}}

.hero{
  position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#07070d;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 50% at 50% 40%,rgba(99,102,241,0.05) 0%,transparent 70%),
             radial-gradient(ellipse 40% 40% at 80% 20%,rgba(0,255,255,0.02) 0%,transparent 60%),
             radial-gradient(ellipse 40% 40% at 20% 80%,rgba(255,215,0,0.02) 0%,transparent 50%);
  pointer-events:none;
}
.hero-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(99,102,241,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,0.02) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 60% 50% at 50% 50%,black 20%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 50%,black 20%,transparent 70%);
  pointer-events:none;
}
.hero-glow{
  position:absolute;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,215,0,0.04),transparent 70%);
  top:15%;left:50%;transform:translate(-50%,-50%);filter:blur(80px);pointer-events:none;
  animation:heroGlow 8s ease-in-out infinite;
}
@keyframes heroGlow{0%,100%{opacity:0.3;transform:translate(-50%,-50%) scale(1);}50%{opacity:0.7;transform:translate(-50%,-50%) scale(1.3);}}
.hero-content{position:relative;z-index:2;text-align:center;padding:0 24px;max-width:600px;}
.hero-avatar{
  width:72px;height:72px;border-radius:50%;margin:0 auto 20px;
  background:linear-gradient(135deg,#ffd700,#f59e0b);padding:2px;
  animation:fadeUp 0.8s ease-out;
}
.hero-avatar-inner{
  width:100%;height:100%;border-radius:50%;background:#07070d;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#ffd700;
}
.hero h1{
  font-size:clamp(32px,5vw,52px);font-weight:800;line-height:1.1;margin-bottom:8px;
  animation:fadeUp 0.8s ease-out 0.1s both;
}
.hero h1 .gold{background:linear-gradient(135deg,#ffd700,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero .tagline{
  font-size:15px;color:#64748b;line-height:1.6;margin-bottom:24px;max-width:440px;margin-left:auto;margin-right:auto;
  animation:fadeUp 0.8s ease-out 0.2s both;
}
.hero-links{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  animation:fadeUp 0.8s ease-out 0.3s both;
}
.hero-links a{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
  color:#e2e8f0;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;
  text-decoration:none;transition:all 0.3s;
}
.hero-links a:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,215,0,0.15);transform:translateY(-2px);}
.hero-links .primary{
  background:rgba(255,215,0,0.08);border-color:rgba(255,215,0,0.12);color:#ffd700;
}
.hero-links .primary:hover{background:rgba(255,215,0,0.12);border-color:rgba(255,215,0,0.2);}
.scroll-indicator{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:rgba(255,215,0,0.15);font-size:9px;letter-spacing:3px;text-transform:uppercase;
  animation:fadeUp 0.8s ease-out 0.5s both;
}
.scroll-line{width:1px;height:24px;background:linear-gradient(to bottom,rgba(255,215,0,0.15),transparent);animation:scrollLine 2.5s ease-in-out infinite;}
@keyframes scrollLine{0%,100%{opacity:0.2;transform:scaleY(1);}50%{opacity:1;transform:scaleY(1.8);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

#particles-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;}

section{position:relative;z-index:1;padding:60px 0;}
.section-header{text-align:center;margin-bottom:40px;}
.section-label{
  display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:#ffd700;margin-bottom:12px;border:1px solid rgba(255,215,0,0.08);
  padding:4px 12px;border-radius:100px;background:rgba(255,215,0,0.03);
}
.section-header h2{
  font-size:clamp(22px,3vw,34px);font-weight:800;margin-bottom:8px;
  background:linear-gradient(135deg,#f1f5f9,#818cf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.section-header p{color:#64748b;font-size:14px;max-width:440px;margin:0 auto;line-height:1.6;}

.filter-bar{
  display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:36px;
  padding:4px;background:rgba(255,255,255,0.02);border-radius:10px;
  border:1px solid rgba(255,255,255,0.04);max-width:400px;
  margin-left:auto;margin-right:auto;backdrop-filter:blur(20px);
}
.filter-btn{
  background:transparent;border:none;color:#64748b;padding:7px 16px;border-radius:8px;
  font-size:12px;font-weight:600;cursor:pointer;transition:all 0.3s;font-family:'Inter',sans-serif;
}
.filter-btn:hover{color:#e2e8f0;background:rgba(255,255,255,0.03);}
.filter-btn.active{background:rgba(255,215,0,0.08);color:#ffd700;box-shadow:inset 0 0 0 1px rgba(255,215,0,0.12);}

.bento{
  max-width:1100px;margin:0 auto;padding:0 20px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
}
.bento .card:nth-child(6n+1){grid-column:span 2;}
.bento .card:nth-child(6n+6){grid-column:span 2;}
@media(max-width:900px){.bento{grid-template-columns:repeat(2,1fr);}.bento .card:nth-child(6n+1),.bento .card:nth-child(6n+6){grid-column:span 2;}}
@media(max-width:540px){.bento{grid-template-columns:1fr;}.bento .card:nth-child(6n+1),.bento .card:nth-child(6n+6){grid-column:span 1;}}

.card{
  position:relative;background:rgba(255,255,255,0.02);border-radius:14px;
  border:1px solid rgba(255,255,255,0.04);padding:20px 18px;cursor:pointer;
  transition:all 0.6s cubic-bezier(0.23,1,0.32,1);overflow:hidden;
  backdrop-filter:blur(12px);opacity:0;transform:translateY(30px);
}
.card.visible{opacity:1;transform:translateY(0);}
.card::before{
  content:'';position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(135deg,rgba(99,102,241,0.04),rgba(255,215,0,0.01));
  opacity:0;transition:opacity 0.5s;pointer-events:none;
}
.card-border{
  position:absolute;inset:-1px;border-radius:15px;pointer-events:none;
  opacity:0;transition:opacity 0.4s;
  background:linear-gradient(135deg,rgba(255,215,0,0.12),rgba(99,102,241,0.08),rgba(0,255,255,0.08));
  z-index:-1;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude;-webkit-mask-composite:exclusive;padding:1px;
}
.card:hover{transform:translateY(-5px);}
.card:hover .card-border{opacity:1;}
.card:hover::before{opacity:1;}
.card:active{transform:translateY(-2px);}
.card .num{
  position:absolute;top:12px;right:14px;font-size:9px;font-weight:800;
  color:rgba(255,255,255,0.03);letter-spacing:0.5px;
}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:4px;}
.card .desc{font-size:11.5px;color:#64748b;line-height:1.5;margin-bottom:10px;}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.card .tag{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:100px;}
.tag-easy{background:rgba(34,197,94,0.08);color:#4ade80;border:1px solid rgba(34,197,94,0.1);}
.tag-medium{background:rgba(234,179,8,0.08);color:#fbbf24;border:1px solid rgba(234,179,8,0.1);}
.tag-hard{background:rgba(244,63,94,0.08);color:#fb7185;border:1px solid rgba(244,63,94,0.1);}
.tag-time{background:rgba(6,182,212,0.06);color:#22d3ee;border:1px solid rgba(6,182,212,0.08);}
.card .bar{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#475569;}
.card .bar-track{flex:1;height:2.5px;background:rgba(255,255,255,0.03);border-radius:4px;overflow:hidden;}
.card .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#ffd700,#f59e0b);transition:width 1s ease;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(20px);
  z-index:100;display:none;align-items:center;justify-content:center;
  padding:20px;opacity:0;transition:opacity 0.4s;
}
.modal-overlay.open{display:flex;opacity:1;}
.modal{
  background:rgba(10,10,20,0.97);border:1px solid rgba(255,215,0,0.05);
  border-radius:18px;max-width:540px;width:100%;max-height:80vh;overflow-y:auto;
  padding:24px;position:relative;transform:scale(0.92) translateY(30px);
  transition:transform 0.5s cubic-bezier(0.23,1,0.32,1);backdrop-filter:blur(30px);
  box-shadow:0 40px 80px rgba(0,0,0,0.6);
}
.modal-overlay.open .modal{transform:scale(1) translateY(0);}
.modal-close{
  position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);
  color:#64748b;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;
}
.modal-close:hover{background:rgba(244,63,94,0.08);color:#fb7185;}
.modal h2{font-size:20px;font-weight:800;margin-bottom:10px;padding-right:28px;}
.modal .blocks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
@media(max-width:500px){.modal .blocks{grid-template-columns:1fr;}}
.modal .block-item{
  display:flex;align-items:center;gap:6px;font-size:12.5px;color:#cbd5e1;
  background:rgba(255,255,255,0.02);border-radius:8px;padding:6px 10px;
  border:1px solid rgba(255,255,255,0.03);
}
.modal .block-item::before{content:'›';color:#ffd700;font-weight:700;font-size:14px;}
.modal .footnote{font-size:12px;color:#475569;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;}

.footer{
  text-align:center;padding:40px 20px 28px;color:#334155;font-size:12.5px;
  border-top:1px solid rgba(255,215,0,0.03);position:relative;z-index:1;
}
.footer a{color:#ffd700;text-decoration:none;font-weight:600;}
.footer a:hover{color:#fbbf24;}

.reveal{opacity:0;transform:translateY(24px);transition:all 0.8s cubic-bezier(0.23,1,0.32,1);}
.reveal.visible{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<canvas id="particles-canvas"></canvas>

<section class="hero">
  <div class="hero-grid"></div>
  <div class="hero-glow"></div>
  <div class="hero-content">
    <div class="hero-avatar"><div class="hero-avatar-inner">И</div></div>
    <h1><span class="gold">Илья</span></h1>
    <p class="tagline">Делаю сайты. 30 готовых решений — выбирай и заказывай.</p>
    <div class="hero-links">
      <a href="#catalog" class="primary">Смотреть каталог</a>
      <a href="https://github.com/IlyaSigma111" target="_blank">GitHub</a>
      <a href="mailto:ilyagulkov25@gmail.com">Почта</a>
    </div>
  </div>
  <div class="scroll-indicator">
    <span>Листай</span>
    <div class="scroll-line"></div>
  </div>
</section>

<section id="catalog">
  <div class="section-header reveal">
    <div class="section-label"><span>✦</span> Каталог</div>
    <h2>Что я делаю</h2>
    <p>Кликни на карточку — увидишь детали</p>
  </div>
  <div class="filter-bar reveal">
    <button class="filter-btn active" onclick="filterBy('all')">Все</button>
    <button class="filter-btn" onclick="filterBy('easy')">Простые</button>
    <button class="filter-btn" onclick="filterBy('medium')">Средние</button>
    <button class="filter-btn" onclick="filterBy('hard')">Сложные</button>
  </div>
  <div class="bento" id="bento"></div>
</section>

<div class="footer">
  <p>© Илья · <a href="https://github.com/IlyaSigma111" target="_blank">github.com/IlyaSigma111</a></p>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div id="modal-content"></div>
  </div>
</div>

  {id:19,name:"Лендинг для бота",desc:"Сайт для бота.",time:"15-25 мин",complex:"easy",n:"4-5 блоков",

  {id:20,name:"Недвижимость",desc:"Продажа объекта.",time:"20-40 мин",complex:"medium",n:"5-7 блоков",

  {id:21,name:"Ресторан / Меню",desc:"Сайт кафе.",time:"30-60 мин",complex:"medium",n:"5-7 блоков",

  {id:22,name:"Фитнес / Тренер",desc:"Сайт тренера.",time:"20-40 мин",complex:"medium",n:"5-6 блоков",

let currentFilter='all',cardObserver;

function filterBy(t){
  currentFilter=t;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.filter-btn[onclick*="${t}"]`).classList.add('active');
  renderGrid(t);
}

function renderGrid(f){
  const grid=document.getElementById('bento');grid.innerHTML='';
  const fd=f==='all'?data:data.filter(d=>d.complex===f);
  const l={easy:'Простой',medium:'Средний',hard:'Сложный'};
  const tc={easy:'tag-easy',medium:'tag-medium',hard:'tag-hard'};
  fd.forEach((d,i)=>{
    const c=document.createElement('div');c.className='card';
    c.style.transitionDelay=`${i*0.03}s`;
    c.onclick=()=>openModal(d.id);
    c.innerHTML=`
      <div class="card-border"></div>
      <span class="num">#${String(d.id).padStart(2,'0')}</span>
      <h3>${d.name}</h3>
      <div class="desc">${d.desc}</div>
      <div class="tags">
        <span class="tag ${tc[d.complex]}">${l[d.complex]}</span>
        <span class="tag tag-time">⏱ ${d.time}</span>
      </div>
      <div class="bar">
        <span>${d.n}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${d.complex==='easy'?'30':d.complex==='medium'?'55':'85'}%"></div></div>
      </div>
    `;
    grid.appendChild(c);
  });
  if(cardObserver) cardObserver.disconnect();
  cardObserver=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');cardObserver.unobserve(e.target);}});},{threshold:0.05});
  document.querySelectorAll('.card').forEach(el=>cardObserver.observe(el));
}

function openModal(id){
  const d=data.find(x=>x.id===id);
  document.getElementById('modal-content').innerHTML=`
    <h2>${d.name}</h2>
    <div class="blocks">${d.blocks.map(b=>'<div class="block-item">'+b+'</div>').join('')}</div>
    <div class="footnote"><span>⏱ ${d.time}</span><span>${d.n}</span></div>
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

const canvas=document.getElementById('particles-canvas'),ctx=canvas.getContext('2d');
let particles=[],w,h;
function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();
class Particle{
  constructor(){this.reset();}
  reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.size=Math.random()*1.8+0.2;this.speedX=(Math.random()-0.5)*0.2;this.speedY=(Math.random()-0.5)*0.2;this.opacity=Math.random()*0.3+0.03;}
  update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<0||this.x>w||this.y<0||this.y>h)this.reset();}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fillStyle=`rgba(255,215,0,${this.opacity})`;ctx.fill();}
}
for(let i=0;i<80;i++)particles.push(new Particle());
function animateParticles(){
  ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.update();p.draw();});
  for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(255,215,0,${0.02*(1-d/100)})`;ctx.lineWidth=0.5;ctx.stroke();}}
  requestAnimationFrame(animateParticles);
}
animateParticles();

const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');}});},{threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
renderGrid('all');
</script>
