<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Илья — делаю сайты</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:#07070d;color:#f1f5f9;overflow-x:hidden;}
::selection{background:#ffd700;color:#0a0a12;}

body::after{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  opacity:0.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:256px;
}

.blob{
  position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;
  animation:blobFloat 25s ease-in-out infinite;
}
.blob-1{width:600px;height:600px;background:rgba(255,215,0,0.03);top:-15%;left:-10%;animation-delay:0s;}
.blob-2{width:500px;height:500px;background:rgba(99,102,241,0.03);bottom:-10%;right:-8%;animation-delay:-8s;}
.blob-3{width:400px;height:400px;background:rgba(0,255,255,0.02);top:50%;left:70%;animation-delay:-16s;}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(40px,-50px) scale(1.1);}66%{transform:translate(-30px,30px) scale(0.9);}}

/* ─── HERO ─── */
.hero{
  position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#07070d;overflow:hidden;padding:40px 24px;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 45% at 50% 45%,rgba(99,102,241,0.06) 0%,transparent 70%),
             radial-gradient(ellipse 35% 35% at 80% 25%,rgba(0,255,255,0.02) 0%,transparent 60%),
             radial-gradient(ellipse 35% 35% at 20% 75%,rgba(255,215,0,0.02) 0%,transparent 50%);
  pointer-events:none;
}
.hero-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(99,102,241,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,0.02) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse 55% 45% at 50% 48%,black 25%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse 55% 45% at 50% 48%,black 25%,transparent 70%);
  pointer-events:none;
}
.hero-glow{
  position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,215,0,0.04),transparent 70%);
  top:20%;left:50%;transform:translate(-50%,-50%);filter:blur(100px);pointer-events:none;
  animation:heroGlow 8s ease-in-out infinite;
}
@keyframes heroGlow{0%,100%{opacity:0.3;transform:translate(-50%,-50%) scale(1);}50%{opacity:0.7;transform:translate(-50%,-50%) scale(1.4);}}

.hero-content{
  position:relative;z-index:2;text-align:center;max-width:640px;
  display:flex;flex-direction:column;align-items:center;
}
.hero-avatar{
  width:96px;height:96px;border-radius:50%;margin-bottom:28px;
  background:linear-gradient(135deg,#ffd700,#f59e0b);padding:2.5px;
  animation:fadeUp 0.8s ease-out;
}
.hero-avatar-inner{
  width:100%;height:100%;border-radius:50%;background:#07070d;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:900;color:#ffd700;
}
.hero h1{
  font-size:clamp(44px,7vw,72px);font-weight:900;line-height:1.05;margin-bottom:8px;
  letter-spacing:-1px;animation:fadeUp 0.8s ease-out 0.1s both;
}
.hero h1 .gold{background:linear-gradient(135deg,#ffd700,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero .title{
  font-size:clamp(18px,2.5vw,24px);color:#94a3b8;font-weight:400;margin-bottom:16px;
  letter-spacing:0.3px;animation:fadeUp 0.8s ease-out 0.15s both;
}
.hero .about-text{
  font-size:clamp(15px,1.6vw,17px);color:#64748b;line-height:1.7;max-width:480px;margin-bottom:32px;
  animation:fadeUp 0.8s ease-out 0.2s both;
}
.hero-links{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
  animation:fadeUp 0.8s ease-out 0.25s both;
}
.hero-links a{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
  color:#e2e8f0;padding:14px 28px;border-radius:14px;font-size:15px;font-weight:600;
  text-decoration:none;transition:all 0.3s;
}
.hero-links a:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,215,0,0.15);transform:translateY(-3px);}
.hero-links .primary{
  background:rgba(255,215,0,0.08);border-color:rgba(255,215,0,0.12);color:#ffd700;
}
.hero-links .primary:hover{background:rgba(255,215,0,0.12);border-color:rgba(255,215,0,0.2);}

.scroll-indicator{
  position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:rgba(255,215,0,0.15);font-size:10px;letter-spacing:3px;text-transform:uppercase;
  animation:fadeUp 0.8s ease-out 0.5s both;
}
.scroll-line{width:1.5px;height:32px;background:linear-gradient(to bottom,rgba(255,215,0,0.15),transparent);animation:scrollLine 2.5s ease-in-out infinite;}
@keyframes scrollLine{0%,100%{opacity:0.2;transform:scaleY(1);}50%{opacity:1;transform:scaleY(1.8);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}

#particles-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;}

/* ─── CATALOG SECTION ─── */
section{position:relative;z-index:1;padding:80px 0;}
.section-header{text-align:center;margin-bottom:48px;}
.section-label{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:#ffd700;margin-bottom:16px;border:1px solid rgba(255,215,0,0.1);
  padding:6px 18px;border-radius:100px;background:rgba(255,215,0,0.03);
}
.section-header h2{
  font-size:clamp(28px,4vw,42px);font-weight:800;margin-bottom:12px;
  background:linear-gradient(135deg,#f1f5f9,#818cf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.section-header p{color:#64748b;font-size:16px;max-width:480px;margin:0 auto;line-height:1.6;}

.filter-bar{
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:44px;
  padding:6px;background:rgba(255,255,255,0.02);border-radius:14px;
  border:1px solid rgba(255,255,255,0.04);max-width:440px;
  margin-left:auto;margin-right:auto;backdrop-filter:blur(20px);
}
.filter-btn{
  background:transparent;border:none;color:#64748b;padding:10px 22px;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s;font-family:'Inter',sans-serif;
}
.filter-btn:hover{color:#e2e8f0;background:rgba(255,255,255,0.03);}
.filter-btn.active{background:rgba(255,215,0,0.08);color:#ffd700;box-shadow:inset 0 0 0 1px rgba(255,215,0,0.12);}

.bento{
  max-width:1200px;margin:0 auto;padding:0 24px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
}
.bento .card:nth-child(6n+1){grid-column:span 2;}
.bento .card:nth-child(6n+6){grid-column:span 2;}
@media(max-width:960px){.bento{grid-template-columns:repeat(2,1fr);}.bento .card:nth-child(6n+1),.bento .card:nth-child(6n+6){grid-column:span 2;}}
@media(max-width:560px){.bento{grid-template-columns:1fr;}.bento .card:nth-child(6n+1),.bento .card:nth-child(6n+6){grid-column:span 1;}}

.card{
  position:relative;background:rgba(255,255,255,0.02);border-radius:16px;
  border:1px solid rgba(255,255,255,0.05);padding:26px 24px;cursor:pointer;
  transition:all 0.6s cubic-bezier(0.23,1,0.32,1);overflow:hidden;
  backdrop-filter:blur(12px);opacity:0;transform:translateY(40px);
}
.card.visible{opacity:1;transform:translateY(0);}
.card::before{
  content:'';position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(135deg,rgba(99,102,241,0.05),rgba(255,215,0,0.02));
  opacity:0;transition:opacity 0.5s;pointer-events:none;
}
.card-border{
  position:absolute;inset:-1px;border-radius:17px;pointer-events:none;
  opacity:0;transition:opacity 0.4s;
  background:linear-gradient(135deg,rgba(255,215,0,0.12),rgba(99,102,241,0.08),rgba(0,255,255,0.08));
  z-index:-1;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude;-webkit-mask-composite:exclusive;padding:1px;
}
.card:hover{transform:translateY(-6px);}
.card:hover .card-border{opacity:1;}
.card:hover::before{opacity:1;}
.card .num{
  position:absolute;top:16px;right:18px;font-size:11px;font-weight:800;
  color:rgba(255,255,255,0.04);letter-spacing:0.5px;
}
.card h3{font-size:18px;font-weight:700;margin-bottom:6px;}
.card .desc{font-size:14px;color:#64748b;line-height:1.5;margin-bottom:14px;}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.card .tag{font-size:11px;font-weight:700;padding:4px 12px;border-radius:100px;}
.tag-easy{background:rgba(34,197,94,0.08);color:#4ade80;border:1px solid rgba(34,197,94,0.1);}
.tag-medium{background:rgba(234,179,8,0.08);color:#fbbf24;border:1px solid rgba(234,179,8,0.1);}
.tag-hard{background:rgba(244,63,94,0.08);color:#fb7185;border:1px solid rgba(244,63,94,0.1);}
.tag-time{background:rgba(6,182,212,0.06);color:#22d3ee;border:1px solid rgba(6,182,212,0.08);}
.card .bar{display:flex;align-items:center;gap:10px;font-size:13px;color:#475569;}
.card .bar-track{flex:1;height:4px;background:rgba(255,255,255,0.04);border-radius:4px;overflow:hidden;}
.card .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#ffd700,#f59e0b);transition:width 1s ease;}

/* ─── MODAL ─── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(24px);
  z-index:100;display:none;align-items:center;justify-content:center;
  padding:24px;opacity:0;transition:opacity 0.4s;
}
.modal-overlay.open{display:flex;opacity:1;}
.modal{
  background:rgba(10,10,20,0.97);border:1px solid rgba(255,215,0,0.06);
  border-radius:20px;max-width:580px;width:100%;max-height:80vh;overflow-y:auto;
  padding:32px;position:relative;transform:scale(0.92) translateY(30px);
  transition:transform 0.5s cubic-bezier(0.23,1,0.32,1);
  box-shadow:0 40px 80px rgba(0,0,0,0.6);
}
.modal-overlay.open .modal{transform:scale(1) translateY(0);}
.modal-close{
  position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);
  color:#64748b;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;
}
.modal-close:hover{background:rgba(244,63,94,0.08);color:#fb7185;}
.modal h2{font-size:26px;font-weight:800;margin-bottom:16px;padding-right:30px;}
.modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
@media(max-width:500px){.modal .grid{grid-template-columns:1fr;}}
.modal .item{
  display:flex;align-items:center;gap:8px;font-size:14px;color:#cbd5e1;
  background:rgba(255,255,255,0.02);border-radius:10px;padding:10px 14px;
  border:1px solid rgba(255,255,255,0.04);
}
.modal .item::before{content:'›';color:#ffd700;font-weight:700;font-size:16px;}
.modal .info{font-size:14px;color:#475569;margin-top:4px;display:flex;gap:16px;}

.footer{
  text-align:center;padding:48px 20px 32px;color:#334155;font-size:14px;
  border-top:1px solid rgba(255,215,0,0.03);position:relative;z-index:1;
}
.footer a{color:#ffd700;text-decoration:none;font-weight:600;}
.footer a:hover{color:#fbbf24;}

.reveal{opacity:0;transform:translateY(32px);transition:all 0.8s cubic-bezier(0.23,1,0.32,1);}
.reveal.visible{opacity:1;transform:translateY(0);}
</style>
</head>

let currentFilter='all',cardObserver;

function filterBy(t){
  currentFilter=t;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.filter-btn[onclick*="${t}"]`).classList.add('active');
  renderGrid(t);
}

function renderGrid(f){
  const grid=document.getElementById('bento');grid.innerHTML='';
  const fd=f==='all'?data:data.filter(d=>d.complex===f);
  const l={easy:'Простой',medium:'Средний',hard:'Сложный'};
  const tc={easy:'tag-easy',medium:'tag-medium',hard:'tag-hard'};
  fd.forEach((d,i)=>{
    const c=document.createElement('div');c.className='card';
    c.style.transitionDelay=`${i*0.03}s`;
    c.onclick=()=>openModal(d.id);
    c.innerHTML=`
      <div class="card-border"></div>
      <span class="num">#${String(d.id).padStart(2,'0')}</span>
      <h3>${d.name}</h3>
      <div class="desc">${d.desc}</div>
      <div class="tags">
        <span class="tag ${tc[d.complex]}">${l[d.complex]}</span>
        <span class="tag tag-time">⏱ ${d.time}</span>
      </div>
      <div class="bar">
        <span>${d.n}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${d.complex==='easy'?'30':d.complex==='medium'?'55':'85'}%"></div></div>
      </div>
    `;
    grid.appendChild(c);
  });
  if(cardObserver) cardObserver.disconnect();
  cardObserver=new IntersectionObserver(e=>{e.forEach(v=>{if(v.isIntersecting){v.target.classList.add('visible');cardObserver.unobserve(v.target);}});},{threshold:0.05});
  document.querySelectorAll('.card').forEach(el=>cardObserver.observe(el));
}

function openModal(id){
  const d=data.find(x=>x.id===id);
  document.getElementById('modal-content').innerHTML=`
    <h2>${d.name}</h2>
    <div class="grid">${d.blocks.map(b=>'<div class="item">'+b+'</div>').join('')}</div>
    <div class="info"><span>⏱ ${d.time}</span><span>${d.n}</span></div>
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

const canvas=document.getElementById('particles-canvas'),ctx=canvas.getContext('2d');
let p=[],w,h;
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;}
addEventListener('resize',resize);resize();
class Pt{
  constructor(){this.reset();}
  reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.s=Math.random()*1.8+0.2;this.dx=(Math.random()-0.5)*0.2;this.dy=(Math.random()-0.5)*0.2;this.o=Math.random()*0.3+0.03;}
  update(){this.x+=this.dx;this.y+=this.dy;if(this.x<0||this.x>w||this.y<0||this.y>h)this.reset();}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fillStyle=`rgba(255,215,0,${this.o})`;ctx.fill();}
}
for(let i=0;i<80;i++)p.push(new Pt());
function a(){
  ctx.clearRect(0,0,w,h);p.forEach(v=>{v.update();v.draw();});
  for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){const dx=p[i].x-p[j].x,dy=p[i].y-p[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){ctx.beginPath();ctx.moveTo(p[i].x,p[i].y);ctx.lineTo(p[j].x,p[j].y);ctx.strokeStyle=`rgba(255,215,0,${0.02*(1-d/100)})`;ctx.lineWidth=0.5;ctx.stroke();}}
  requestAnimationFrame(a);
}
a();

const obs=new IntersectionObserver(e=>{e.forEach(v=>{if(v.isIntersecting)v.target.classList.add('visible');});},{threshold:0.1});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
renderGrid('all');
</script>
